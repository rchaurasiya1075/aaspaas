<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AasPaas</title>
  <meta name="description" content="AasPaas — email ya mobile se login. Range ke andar kamra aur number." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root { --bg:#f6f1e8; --card:#fffdf8; --ink:#1c1915; --muted:#6f675e; --line:#e4d9c8; --saffron:#c4621a; --olive:#3f5344; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }
    header, main { width: min(720px, 100%); margin: 0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding: 20px 16px; }
    .brand { font-size: 28px; font-weight: 650; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
    h1 { font-size: 40px; line-height: 1.1; margin: 8px 0; }
    .muted { color: var(--muted); }
    .btn { display:flex; align-items:center; justify-content:center; min-height: 46px; border:0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 650; text-decoration: none; }
    .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    label { display:block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
    input, select { width:100%; min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: white; padding: 0 12px; color: var(--ink); }
    .err { color: var(--saffron); font-size: 14px; }
    .ok { color: var(--olive); font-size: 14px; }
    .roles { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .roles button { min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: white; }
    .roles button.on { background: var(--ink); color: var(--bg); }
    #map { height: 320px; border-radius: 18px; background: #efe6d8; }
    .room { margin-top: 12px; }
    .row { display:flex; justify-content:space-between; gap: 8px; }
    .actions { display:flex; gap: 8px; margin-top: 10px; }
    .actions a, .actions span { flex:1; min-height: 42px; border-radius: 999px; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size: 14px; font-weight: 650; }
    .call { background: var(--ink); color: var(--bg); }
    .wa { border: 1px solid var(--line); }
    .login-stage { min-height: 100vh; display:grid; place-items:center; padding: 16px; background: #e7ebf0; }
    .login-frame { width: min(980px, 100%); display:grid; background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 70px rgba(28,25,21,.12); }
    .bloom { min-height: 220px; background: #1c1915 url("login-bloom.jpg") center/cover no-repeat; }
    .panel { padding: 28px 22px 22px; }
    @media (min-width: 900px) {
      .login-frame { grid-template-columns: 1.05fr .95fr; min-height: 680px; }
      .bloom { min-height: 100%; order: 2; }
    }
  </style>
</head>
<body>
  <div id="gate" class="login-stage">
    <div class="login-frame">
      <div class="bloom"></div>
      <section class="panel">
        <p class="brand">AasPaas</p>
        <h1 id="title" style="font-size:32px">Welcome Back</h1>
        <p id="line" class="muted">Email aur password, ya mobile aur password. Forgot password par reset link email par jayega.</p>
        <div id="roles" class="roles">
          <button id="role-tenant" class="on" type="button">Room Seeker</button>
          <button id="role-owner" type="button">Room Owner</button>
        </div>
        <form id="form">
          <div id="name-wrap" class="hidden"><label>Name<input id="name" placeholder="Your name" /></label></div>
          <label id="id-label">Email or mobile<input id="ident" placeholder="you@gmail.com or 9876543210" autocomplete="username" /></label>
          <div id="phone-wrap" class="hidden"><label>Mobile<input id="phone" inputmode="numeric" placeholder="10 digit mobile" /></label></div>
          <div id="pass-wrap"><label>Password<input id="password" type="password" placeholder="At least 8 characters" /></label></div>
          <p id="note" class="ok hidden"></p>
          <p id="error" class="err hidden"></p>
          <div style="display:flex;justify-content:flex-end;margin-top:8px">
            <button id="forgot" type="button" style="border:0;background:transparent;color:#5c6b7a;font-size:12px;font-weight:700">Forgot Password?</button>
          </div>
          <button id="submit" class="btn" style="width:100%;margin-top:8px" type="submit">Sign in</button>
        </form>
        <button id="google" class="btn ghost" style="width:100%;margin-top:10px" type="button">Sign in with Google</button>
        <p style="text-align:center;margin-top:16px" class="muted">
          <button id="swap" type="button" style="border:0;background:transparent;font-weight:750;color:#5c6b7a">Don’t have an account? Sign up</button>
        </p>
      </section>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <div class="brand">AasPaas</div>
        <div id="who" class="muted" style="font-size:13px"></div>
      </div>
      <button id="out" type="button" style="border:0;background:transparent" class="muted">Sign out</button>
    </header>
    <main style="padding:0 16px 40px;display:grid;gap:14px">
      <section id="tenant-box" class="card">
        <div class="row"><strong>Range</strong><span id="radius-label">3 km</span></div>
        <input id="radius" type="range" min="1" max="10" value="3" />
        <button id="gps" class="btn ghost" style="margin-top:10px" type="button">Detect GPS</button>
      </section>
      <form id="owner-box" class="card hidden">
        <strong>Add a room</strong>
        <label>Address<input id="place" placeholder="Koldiha, Giridih" /></label>
        <label>Room<input id="room-title" placeholder="1 BHK Room" /></label>
        <label>Rent<input id="rent" type="number" min="500" placeholder="4500" /></label>
        <button class="btn" style="width:100%;margin-top:12px" type="submit">Add room on the map</button>
      </form>
      <div id="map"></div>
      <div id="feed"></div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, get, set, onValue, push } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const firebaseApp = initializeApp({
      apiKey: "AIzaSyBsTplAWUCFk1uM0MnGHogP46KLuYYCyJc",
      authDomain: "findlocation-8f5a6.firebaseapp.com",
      databaseURL: "https://findlocation-8f5a6-default-rtdb.firebaseio.com",
      projectId: "findlocation-8f5a6",
      storageBucket: "findlocation-8f5a6.firebasestorage.app",
      messagingSenderId: "913100192065",
      appId: "1:913100192065:web:77e34912677bfb79afc9c0"
    });
    const auth = getAuth(firebaseApp);
    const db = getDatabase(firebaseApp);
    const HOME = { lat: 24.1882, lng: 86.3049 };
    let mode = "in";
    let role = "tenant";
    let map, userMarker, circle;
    let here = { ...HOME };
    let radius = 3;
    let rooms = [];
    let roomsListen = false;

    const $ = (id) => document.getElementById(id);
    function show(id, text, cls) {
      const el = $(id);
      el.textContent = text || "";
      el.classList.toggle("hidden", !text);
      if (cls) el.className = cls;
    }
    function explain(err) {
      const code = err && err.code ? err.code : "";
      if (code === "auth/operation-not-allowed") return "Firebase mein Email/Password abhi off hai. Console: Authentication, Sign-in method, Email/Password, Enable. Password wala switch on karein.";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "Email, mobile, ya password match nahi hua.";
      if (code === "auth/email-already-in-use") return "Ye email pehle se hai. Sign in karein.";
      if (code === "auth/popup-blocked") return "Popup block hai. Allow karke Google dubara try karein.";
      if (code === "auth/unauthorized-domain") return "Is site par Google login allow nahi. Firebase authorized domains mein github.io add karein, ya email se sign in karein.";
      return (err && err.message) || "Phir try karein.";
    }
    async function emailFor(id) {
      const raw = id.trim();
      if (raw.includes("@")) return raw.toLowerCase();
      const phone = raw.replace(/\D/g, "").slice(-10);
      if (phone.length !== 10) throw new Error("Email ya 10 digit mobile likhiye.");
      const snap = await get(ref(db, "phones/" + phone));
      const email = snap.val() && snap.val().email;
      if (!email) throw new Error("Ye mobile register nahi hai. Pehle sign up karein.");
      return String(email).toLowerCase();
    }
    function paintMode() {
      const up = mode === "up";
      const reset = mode === "reset";
      $("title").textContent = reset ? "Reset password" : up ? "Create account" : "Welcome Back";
      $("name-wrap").classList.toggle("hidden", !up);
      $("phone-wrap").classList.toggle("hidden", !up);
      $("id-label").firstChild.textContent = up ? "Email" : "Email or mobile";
      $("ident").placeholder = up ? "you@gmail.com" : "you@gmail.com or 9876543210";
      $("pass-wrap").classList.toggle("hidden", reset);
      $("forgot").classList.toggle("hidden", mode !== "in");
      $("google").classList.toggle("hidden", reset);
      $("roles").classList.toggle("hidden", reset);
      $("submit").textContent = reset ? "Send reset link" : up ? "Sign up" : "Sign in";
      $("swap").textContent = reset ? "Back to sign in" : up ? "Already have an account? Sign in" : "Don’t have an account? Sign up";
    }
    function setRole(next) {
      role = next;
      $("role-tenant").classList.toggle("on", next === "tenant");
      $("role-owner").classList.toggle("on", next === "landlord");
    }
    $("role-tenant").onclick = () => setRole("tenant");
    $("role-owner").onclick = () => setRole("landlord");
    $("forgot").onclick = () => { mode = "reset"; show("error", ""); paintMode(); };
    $("swap").onclick = () => { mode = mode === "in" ? "up" : "in"; show("error", ""); paintMode(); };
    $("out").onclick = () => signOut(auth);
    $("form").onsubmit = async (e) => {
      e.preventDefault();
      show("error", "");
      show("note", "");
      $("submit").disabled = true;
      try {
        if (mode === "reset") {
          const target = await emailFor($("ident").value);
          await sendPasswordResetEmail(auth, target);
          show("note", "Reset link bhej diya: " + target, "ok");
          mode = "in";
          paintMode();
          return;
        }
        const password = $("password").value;
        if (password.length < 8) throw new Error("Password kam se kam 8 characters ka ho.");
        if (mode === "up") {
          const mail = $("ident").value.trim().toLowerCase();
          const mobile = $("phone").value.replace(/\D/g, "").slice(-10);
          const name = $("name").value.trim();
          if (!mail.includes("@")) throw new Error("Reset ke liye asli email likhiye.");
          if (mobile.length !== 10) throw new Error("10 digit mobile likhiye.");
          if (name.length < 2) throw new Error("Apna naam likhiye.");
          const taken = await get(ref(db, "phones/" + mobile));
          if (taken.exists()) throw new Error("Ye mobile pehle se kisi account par hai.");
          const cred = await createUserWithEmailAndPassword(auth, mail, password);
          await updateProfile(cred.user, { displayName: name });
          await set(ref(db, "users/" + cred.user.uid), { name, email: mail, phone: mobile, role, radiusKm: 3, lat: HOME.lat, lng: HOME.lng });
          await set(ref(db, "phones/" + mobile), { email: mail, uid: cred.user.uid });
        } else {
          const mail = await emailFor($("ident").value);
          await signInWithEmailAndPassword(auth, mail, password);
        }
      } catch (err) {
        show("error", explain(err), "err");
      } finally {
        $("submit").disabled = false;
      }
    };
    $("google").onclick = async () => {
      show("error", "");
      try {
        const cred = await signInWithPopup(auth, new GoogleAuthProvider());
        const prev = await get(ref(db, "users/" + cred.user.uid));
        const old = prev.val() || {};
        await set(ref(db, "users/" + cred.user.uid), {
          name: old.name || cred.user.displayName || "",
          email: cred.user.email || old.email || "",
          phone: old.phone || "",
          role: old.role || role,
          radiusKm: old.radiusKm || 3,
          lat: old.lat || HOME.lat,
          lng: old.lng || HOME.lng
        });
      } catch (err) {
        show("error", explain(err), "err");
      }
    };

    function km(aLat, aLng, bLat, bLng) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLng = (bLng - aLng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s)));
    }
    function drawMap() {
      if (typeof L === "undefined") return;
      if (!map) {
        map = L.map("map", { scrollWheelZoom: false }).setView([here.lat, here.lng], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "OpenStreetMap" }).addTo(map);
        userMarker = L.circleMarker([here.lat, here.lng], { radius: 8, color: "#1c1915", fillOpacity: 1 }).addTo(map);
        circle = L.circle([here.lat, here.lng], { radius: radius * 1000, color: "#c4621a", fillOpacity: 0.12 }).addTo(map);
        setTimeout(() => map.invalidateSize(), 200);
      }
      map.setView([here.lat, here.lng]);
      userMarker.setLatLng([here.lat, here.lng]);
      circle.setLatLng([here.lat, here.lng]);
      circle.setRadius(radius * 1000);
      if (window.roomLayer) map.removeLayer(window.roomLayer);
      window.roomLayer = L.layerGroup().addTo(map);
      rooms.forEach((room) => L.circleMarker([room.lat, room.lng], { radius: 6, color: "#c4621a" }).bindTooltip(room.title).addTo(window.roomLayer));
    }
    function renderRooms() {
      const owner = me && me.role === "landlord";
      $("feed").innerHTML = rooms.map((room) => {
        const dist = km(here.lat, here.lng, room.lat, room.lng);
        const open = owner || dist <= radius;
        const phone = String(room.phone || "").replace(/\D/g, "").slice(-10);
        const actions = open
          ? `<div class="actions"><a class="call" href="tel:${phone}">Call</a><a class="wa" target="_blank" rel="noreferrer" href="https://wa.me/91${phone}">WhatsApp</a></div>`
          : `<p class="muted">Range ke bahar. Number chhupa hai.</p>`;
        return `<article class="card room"><div class="row"><div><strong>${room.title}</strong><div class="muted">${room.place} · ${dist.toFixed(1)} km</div></div><div>₹${Number(room.rent).toLocaleString("en-IN")}</div></div>${actions}</article>`;
      }).join("");
      drawMap();
    }
    $("radius").oninput = (e) => {
      radius = Number(e.target.value);
      $("radius-label").textContent = radius + " km";
      renderRooms();
    };
    $("gps").onclick = () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition((pos) => {
        here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (auth.currentUser) set(ref(db, "users/" + auth.currentUser.uid + "/lat"), here.lat);
        if (auth.currentUser) set(ref(db, "users/" + auth.currentUser.uid + "/lng"), here.lng);
        renderRooms();
      });
    };
    $("owner-box").onsubmit = async (e) => {
      e.preventDefault();
      const title = $("room-title").value.trim();
      const place = $("place").value.trim();
      const rent = Number($("rent").value);
      if (!title || !place || !rent) return;
      await push(ref(db, "rooms"), { title, place, rent, lat: here.lat, lng: here.lng, phone: (me && me.phone) || "9876543210", ownerId: auth.currentUser.uid });
      e.target.reset();
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        $("gate").classList.remove("hidden");
        $("app").classList.add("hidden");
        return;
      }
      const snap = await get(ref(db, "users/" + user.uid));
      me = snap.val() || { name: user.displayName || "AasPaas", email: user.email || "", phone: "", role: "tenant", radiusKm: 3, lat: HOME.lat, lng: HOME.lng };
      role = me.role === "landlord" ? "landlord" : "tenant";
      radius = Number(me.radiusKm) || 3;
      here = { lat: Number(me.lat) || HOME.lat, lng: Number(me.lng) || HOME.lng };
      $("radius").value = String(radius);
      $("radius-label").textContent = radius + " km";
      $("who").textContent = (role === "landlord" ? "Room owner" : "Room seeker") + " · " + (me.name || me.email);
      $("tenant-box").classList.toggle("hidden", role === "landlord");
      $("owner-box").classList.toggle("hidden", role !== "landlord");
      $("gate").classList.add("hidden");
      $("app").classList.remove("hidden");
      await set(ref(db, "rooms/seed-koldiha"), { title: "1 BHK Furnished Room", rent: 4500, place: "Durga Mandap, Koldiha", lat: 24.191, lng: 86.308, phone: "9876543210" });
      await set(ref(db, "rooms/seed-giridih"), { title: "Single Bachelor Room", rent: 2800, place: "Main Road, Giridih", lat: 24.182, lng: 86.299, phone: "9123456780" });
      if (!roomsListen) {
        roomsListen = true;
        onValue(ref(db, "rooms"), (snapRooms) => {
          const val = snapRooms.val() || {};
          rooms = Object.entries(val).map(([id, room]) => ({ id, ...room }));
          renderRooms();
        });
      }
    });
    paintMode();
  </script>
</body>
</html>
